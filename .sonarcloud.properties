#
# SonarCloud automatic analysis settings.
#
# tests/workflows/fixtures holds deliberately broken workflow trees: each
# -fail- case (for example a reusable workflow pinned to a short SHA) exists
# so that tests/workflows/standards_callers_test.sh can prove it rejects that
# input. They are test data, not workflows this repository runs, so they are
# left out of analysis. The test script itself is still analysed.
sonar.exclusions=tests/workflows/fixtures/**

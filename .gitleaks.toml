#
# Gitleaks configuration for this repository.
#
# The estate secret scanner (hyperpolymath/standards,
# secret-scanner-reusable.yml) stages the estate baseline allowlist at the
# workspace root as `.gitleaks-estate.toml`, then scans the tree with THIS
# file. This file therefore extends the baseline instead of copying it. A
# copy cannot allowlist the staged baseline itself, whose documented
# placeholder shapes then trip generic-api-key: that was the three findings
# in `.gitleaks-estate.toml` that kept `scan / gitleaks` red. The baseline
# allowlists its own path, so extending it clears them, and every entry the
# old copy carried is in the baseline too.
#
# Add an entry below only for a false positive that is true of THIS
# repository alone, anchored `^...$` to the whole secret value (see the
# baseline's design rule). Universal entries belong in the baseline.
#
# To run locally, stage the baseline at the commit the scanner pins:
#   git -C ../standards show <sha>:config/gitleaks/estate-baseline.toml \
#     > .gitleaks-estate.toml
#   gitleaks detect --source . --no-git --config .gitleaks.toml

[extend]
path = ".gitleaks-estate.toml"

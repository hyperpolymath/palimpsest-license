#
# Warrant levels (spec/PROVENANCE-SPEC.adoc §7).  pull_request has no branch
# filter so that stacked PRs, whose base is another PR's branch, are checked.
name: Warrant levels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  records:
    name: Warrant records against formats/warrant.ncl
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Built from crates.io at a pinned version with its lockfile; this is
      # the slow step (several minutes), there being no packaged Nickel.
      - name: Install Nickel 1.18.0
        run: |
          cargo install nickel-lang-cli --version 1.18.0 --locked
          test "$(nickel --version | cut -d' ' -f1-3)" = 'nickel-lang-cli nickel 1.18.0'

      - name: Records, spec example, coverage and expected rejections
        run: bash scripts/check-warrant-records.sh

  agda:
    name: Provenance.Warrant typechecks; reject fixtures are refused
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The same pinned container and Agda as epistemic-types' Proof Safety job.
    container: debian:13-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Install authenticated Debian toolchain packages
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git agda-bin=2.6.4.3-1+b2

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Fetch pinned siblings
        run: bash scripts/fetch-siblings.sh

      - name: Kernel module and expected rejections
        run: |
          test "$(agda --version)" = 'Agda version 2.6.4.3'
          bash scripts/check-agda.sh

  # The Haskell validator in TOOLS/validation/haskell, built with Ubuntu's own
  # GHC and Haskell libraries and no Hackage: cabal resolves every dependency
  # from the apt-installed global package database.
  validator:
    name: Haskell validator builds and its tests pass
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # GHC 9.4.7 and cabal-install 3.8.1, plus the libraries named in the
      # build-depends of the library, executable and test suite that do not
      # ship with GHC (base, bytestring, containers, directory, filepath, mtl
      # and text do).
      - name: Install GHC, cabal-install and Haskell libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ghc cabal-install \
            libghc-aeson-dev libghc-hspec-dev libghc-optparse-applicative-dev \
            libghc-quickcheck2-dev libghc-regex-tdfa-dev libghc-temporary-dev \
            libghc-vector-dev libghc-xml-conduit-dev

      # A cabal config with no package repository, so cabal uses only the apt
      # packages.  The runner image may also carry a GHC and cabal (ghcup)
      # earlier on PATH, hence with-compiler and /usr/bin/cabal.
      - name: Configure cabal without a package repository
        run: |
          mkdir -p ~/.cabal
          printf '%s\n' "remote-repo-cache: $HOME/.cabal/packages" \
            'with-compiler: /usr/bin/ghc' > ~/.cabal/config
          /usr/bin/cabal --version
          /usr/bin/ghc --version

      - name: Build
        working-directory: TOOLS/validation/haskell
        run: /usr/bin/cabal build all --enable-tests

      - name: Test
        working-directory: TOOLS/validation/haskell
        run: /usr/bin/cabal test --test-show-details=direct

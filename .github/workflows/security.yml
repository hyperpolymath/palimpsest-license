# SPDX-License-Identifier: PMPL-1.0-or-later
name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * 1" # weekly

permissions:
  actions: read
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # No 'python': the repository has no Python (CLAUDE.md bans it), and
        # CodeQL fails a language with nothing to extract as a configuration
        # error ("could not process any code written in Python").
        language: [ 'javascript', 'rust' ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@3db7caf9014b962f9392088c0fcaf53eeddf47db # v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@3db7caf9014b962f9392088c0fcaf53eeddf47db # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@3db7caf9014b962f9392088c0fcaf53eeddf47db # v3

  # OpenSSF Scorecard is not run here: scorecard.yml calls the estate
  # scorecard-reusable, which owns SARIF publication. A second, direct
  # publisher is retired (governance / Check Workflow Staleness).

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4

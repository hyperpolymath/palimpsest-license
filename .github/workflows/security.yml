# SPDX-License-Identifier: PMPL-1.0-or-later
name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * 1" # weekly

permissions:
  actions: read
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # No 'python': the repository has no Python (CLAUDE.md bans it), and
        # CodeQL fails a language with nothing to extract as a configuration
        # error ("could not process any code written in Python").
        language: [ 'javascript', 'rust' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@main
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@main

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@main

  # OpenSSF Scorecard is not run here: scorecard.yml calls the estate
  # scorecard-reusable, which owns SARIF publication. A second, direct
  # publisher is retired (governance / Check Workflow Staleness).

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Dependency Review
        uses: actions/dependency-review-action@v4.9.0

# SPDX-License-Identifier: PMPL-1.0-or-later
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: write

jobs:
  build-and-release:
    name: Build release artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Build tools
        run: |
          if [ -d "tools" ]; then
            cd tools
            for crate in pmpl-sign pmpl-verify pmpl-audit; do
              if [ -d "$crate" ]; then
                echo "Building $crate"
                (cd "$crate" && cargo build --release)
              fi
            done
          fi

      - name: Prepare artefacts
        run: |
          mkdir -p dist
          if [ -f tools/pmpl-sign/target/release/pmpl-sign ]; then
            cp tools/pmpl-sign/target/release/pmpl-sign dist/
          fi
          if [ -f tools/pmpl-verify/target/release/pmpl-verify ]; then
            cp tools/pmpl-verify/target/release/pmpl-verify dist/
          fi
          if [ -f tools/pmpl-audit/target/release/pmpl-audit ]; then
            cp tools/pmpl-audit/target/release/pmpl-audit dist/
          fi
          ls -R dist || true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/**'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

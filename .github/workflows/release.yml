# SPDX-License-Identifier: PMPL-1.0-or-later
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: write

jobs:
  build-and-release:
    name: Build release artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Build tools
        run: |
          if [ -d "tools" ]; then
            cd tools
            for crate in pmpl-sign pmpl-verify pmpl-audit; do
              if [ -d "$crate" ]; then
                echo "Building $crate"
                (cd "$crate" && cargo build --release)
              fi
            done
          fi

      - name: Prepare artefacts
        run: |
          mkdir -p dist
          if [ -f tools/pmpl-sign/target/release/pmpl-sign ]; then
            cp tools/pmpl-sign/target/release/pmpl-sign dist/
          fi
          if [ -f tools/pmpl-verify/target/release/pmpl-verify ]; then
            cp tools/pmpl-verify/target/release/pmpl-verify dist/
          fi
          if [ -f tools/pmpl-audit/target/release/pmpl-audit ]; then
            cp tools/pmpl-audit/target/release/pmpl-audit dist/
          fi
          ls -R dist || true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'dist/**'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

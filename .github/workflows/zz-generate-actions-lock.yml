# SPDX-License-Identifier: PMPL-1.0-or-later
# TEMPORARY: rebuilds .github/workflows/actions.lock with the estate lock repair
# chain, using close-lock.sh from standards 23e258b (reusable-workflow records
# carry their called workflow's uses:), checks it with the governance gate at
# standards b26d3fb and with check-lock-sync, and prints it. Removed in the next
# commit; it deletes itself before generating so it is not locked.
name: TEMP generate actions.lock
on:
  push:
    branches: [claude/new-session-8bfbi9-ci-actions-lock]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: hyperpolymath/standards
          ref: 23e258b83888f1788843f5c171a07b78d7f7707c
          path: .standards-chain
          persist-credentials: false
          sparse-checkout: |
            scripts/relock-sha-keys.sh
            scripts/complete-job-refs.sh
            scripts/close-lock.sh
            scripts/prune-stale.sh
            scripts/check-lock-sync.sh
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: hyperpolymath/standards
          ref: b26d3fb548fa2c4a7920cc69128821811d4e3222
          path: .standards-gate
          persist-credentials: false
          sparse-checkout: |
            scripts/check-actions-lock-gate.sh
            scripts/update-actions-lock.sh
          sparse-checkout-cone-mode: false
      - name: Generate (estate lock repair chain) and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e -uo pipefail
          T="$RUNNER_TEMP"; mkdir -p "$T/chain" "$T/gate" "$T/bin"
          cp .standards-chain/scripts/*.sh "$T/chain/"; cp .standards-gate/scripts/*.sh "$T/gate/"
          rm -rf .standards-chain .standards-gate .github/workflows/zz-generate-actions-lock.yml .github/workflows/actions.lock
          if command -v gawk >/dev/null; then ln -sf "$(command -v gawk)" "$T/bin/awk"; export PATH="$T/bin:$PATH"; fi
          mkdir -p "$T/orig" && cp .github/workflows/*.yml "$T/orig/"
          gh extension install github/gh-actions-lock --pin v0.1.6
          gh extension list
          echo "=== 1. gh actions-lock"; gh actions-lock --no-interactive; echo "exit=$?"
          echo "=== 2. restore the SHA-pinned workflows"; cp "$T"/orig/*.yml .github/workflows/
          echo "=== 3. relock-sha-keys"; bash "$T/chain/relock-sha-keys.sh" .github/workflows; echo "exit=$?"
          echo "=== 4. complete-job-refs"; bash "$T/chain/complete-job-refs.sh" .github/workflows; echo "exit=$?"
          echo "=== 5. close-lock (23e258b)"; bash "$T/chain/close-lock.sh" .github/workflows; echo "exit=$?"
          echo "=== 6. prune-stale"; bash "$T/chain/prune-stale.sh" .github/workflows; echo "exit=$?"
          echo "=== gate (b26d3fb, exactly as governance runs it)"
          ACTIONS_LOCK_VERIFIER="$T/gate/update-actions-lock.sh" bash "$T/gate/check-actions-lock-gate.sh" .github/workflows; echo "gate exit=$?"
          echo "=== check-lock-sync"; bash "$T/chain/check-lock-sync.sh" .github/workflows; echo "sync exit=$?"
          echo "=== full verification (network)"; gh actions-lock --verify --json=valid,findings; echo "verify exit=$?"
          echo "=== workflow diff (must show only the two removed files)"; git status --short -- .github/workflows
          echo "=== sha256"; sha256sum .github/workflows/actions.lock; wc -l .github/workflows/actions.lock
          echo "=== BEGIN actions.lock"; cat .github/workflows/actions.lock; echo "=== END actions.lock"

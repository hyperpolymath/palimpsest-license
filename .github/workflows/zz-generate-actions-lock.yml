# TEMPORARY: builds .github/workflows/actions.lock with the estate's lock
# repair chain and prints it. Removed in the next commit; it deletes itself
# before generating so it is not locked.
name: TEMP generate actions.lock
on:
  push:
    branches: [claude/new-session-8bfbi9-ci-actions-lock]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: hyperpolymath/standards
          ref: fad242d35291de1898242d6737ba02b74a59a2f2
          path: .standards-gate
          persist-credentials: false
          sparse-checkout: |
            scripts/check-actions-lock-gate.sh
            scripts/update-actions-lock.sh
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: hyperpolymath/standards
          ref: b26d3fb548fa2c4a7920cc69128821811d4e3222
          path: .standards-chain
          persist-credentials: false
          sparse-checkout: |
            scripts/relock-sha-keys.sh
            scripts/complete-job-refs.sh
            scripts/close-lock.sh
            scripts/prune-stale.sh
          sparse-checkout-cone-mode: false
      - name: Generate (estate lock repair chain) and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e -uo pipefail
          T="$RUNNER_TEMP"
          cp .standards-gate/scripts/*.sh .standards-chain/scripts/*.sh "$T/"
          rm -rf .standards-gate .standards-chain .github/workflows/zz-generate-actions-lock.yml
          mkdir -p "$T/orig" && cp .github/workflows/*.yml "$T/orig/"
          gh extension install github/gh-actions-lock
          gh extension list
          echo "=== 1. gh actions-lock"; gh actions-lock --no-interactive; echo "exit=$?"
          echo "=== 2. restore the SHA-pinned workflows"; cp "$T"/orig/*.yml .github/workflows/
          echo "=== 3. relock-sha-keys"; bash "$T/relock-sha-keys.sh" .github/workflows; echo "exit=$?"
          echo "=== 4. complete-job-refs"; bash "$T/complete-job-refs.sh" .github/workflows; echo "exit=$?"
          echo "=== 5. close-lock"; bash "$T/close-lock.sh" .github/workflows; echo "exit=$?"
          echo "=== 6. prune-stale"; bash "$T/prune-stale.sh" .github/workflows; echo "exit=$?"
          echo "=== gate (fad242d, exactly as governance runs it)"
          ACTIONS_LOCK_VERIFIER="$T/update-actions-lock.sh" bash "$T/check-actions-lock-gate.sh" .github/workflows; echo "gate exit=$?"
          echo "=== full verification (network)"; gh actions-lock --verify --json=valid,findings; echo "verify exit=$?"
          echo "=== workflow diff (must be empty)"; git diff --stat -- .github/workflows
          echo "=== sha256"; sha256sum .github/workflows/actions.lock; wc -l .github/workflows/actions.lock
          echo "=== BEGIN actions.lock"; cat .github/workflows/actions.lock; echo "=== END actions.lock"

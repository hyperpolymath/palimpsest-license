# SPDX-License-Identifier: PMPL-1.0-or-later
# TEMPORARY: generates .github/workflows/actions.lock with the authoritative
# tool and prints it, then the governance gate's own check against it. Removed
# in the next commit; it deletes itself before generating so it is not locked.
name: TEMP generate actions.lock
on:
  push:
    branches: [claude/new-session-8bfbi9-ci-actions-lock]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: hyperpolymath/standards
          ref: fad242d35291de1898242d6737ba02b74a59a2f2
          path: .standards-lock
          persist-credentials: false
          sparse-checkout: |
            scripts/check-actions-lock-gate.sh
            scripts/update-actions-lock.sh
          sparse-checkout-cone-mode: false
      - name: Generate and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e -uo pipefail
          cp .standards-lock/scripts/check-actions-lock-gate.sh .standards-lock/scripts/update-actions-lock.sh "$RUNNER_TEMP/"
          rm -rf .standards-lock .github/workflows/zz-generate-actions-lock.yml
          show() {
            echo "=== $1: workflow diff stat"; git diff --stat -- .github/workflows ':!.github/workflows/actions.lock'
            echo "=== $1: sample uses lines"; grep -h "uses: actions/checkout" .github/workflows/*.yml | sort | uniq -c
            echo "=== $1: lock"; sha256sum .github/workflows/actions.lock 2>/dev/null
            echo "=== BEGIN $1 actions.lock"; cat .github/workflows/actions.lock 2>/dev/null; echo "=== END $1 actions.lock"
          }
          echo "=== step 1: generate with v0.1.6"
          gh extension install github/gh-actions-lock --pin v0.1.6
          bash "$RUNNER_TEMP/update-actions-lock.sh" .github/workflows; echo "v0.1.6 update exit=$?"
          show "after-v0.1.6"
          echo "=== step 2: latest release in fix mode on top (locked pins are sticky)"
          gh extension remove actions-lock
          gh extension install github/gh-actions-lock
          gh extension list
          bash "$RUNNER_TEMP/update-actions-lock.sh" .github/workflows; echo "latest update exit=$?"
          show "after-latest"
          echo "=== step 3: the gate, exactly as governance runs it"
          ACTIONS_LOCK_VERIFIER="$RUNNER_TEMP/update-actions-lock.sh" bash "$RUNNER_TEMP/check-actions-lock-gate.sh" .github/workflows; echo "gate exit=$?"
          echo "=== full workflow diff"; git diff -- .github/workflows ':!.github/workflows/actions.lock'

# SPDX-License-Identifier: PMPL-1.0-or-later
name: Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '*.adoc'
      - 'legal/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '*.adoc'
      - 'legal/**'
      - '.github/workflows/docs.yml'

permissions:
  actions: read
  contents: read

jobs:
  build-docs:
    name: Build AsciiDoc docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Asciidoctor
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor

      - name: Build key docs
        run: |
          mkdir -p build/docs
          find . -name '*.adoc' -print0 | xargs -0 -n1 asciidoctor -D build/docs

  link-check:
    name: Check external links (best-effort)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install lychee (pinned, checksum-verified)
        run: |
          set -euo pipefail
          # Pinned: `releases/latest/download/lychee-linux-x86_64.tar.gz`
          # began returning 404 when lychee renamed its release assets to
          # target triples, which failed this job before any link was checked.
          LYCHEE_VERSION=0.24.2
          SHA256=1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
          asset=lychee-x86_64-unknown-linux-gnu
          curl --proto "=https" --tlsv1.2 -fsSL -o lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${asset}.tar.gz"
          echo "${SHA256}  lychee.tar.gz" | sha256sum -c -
          tar -xzf lychee.tar.gz "${asset}/lychee"
          sudo mv "${asset}/lychee" /usr/local/bin/lychee
          rm -rf lychee.tar.gz "${asset}"
          lychee --version

      - name: Run link checker
        run: |
          lychee --no-progress --max-redirects 5 --retry-wait-time 2 --timeout 10 \
            README.adoc docs || true

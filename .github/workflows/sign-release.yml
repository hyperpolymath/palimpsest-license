# SPDX-License-Identifier: PMPL-1.0-or-later
name: Sign Release Artefacts

on:
  release:
    types: [published]

permissions:
  actions: read
  contents: write

jobs:
  sign:
    name: Sign release artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Build pmpl-sign
        run: |
          cd tools/pmpl-sign
          cargo build --release

      - name: Sign artefacts
        run: |
          mkdir -p signatures
          for file in dist/*; do
            echo "Signing $file"
            tools/pmpl-sign/target/release/pmpl-sign "$file" \
              --output "signatures/$(basename "$file").sig"
          done

      - name: Upload signatures
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          files: signatures/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
